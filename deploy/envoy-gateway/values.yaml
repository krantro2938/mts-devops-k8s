# Envoy Gateway (Gateway API implementation) controller values.
# The chart also installs the Gateway API CRDs (v1.6.1) and Envoy Gateway CRDs.
deployment:
  envoyGateway:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
    logging:
      level:
        default: info
