# Envoy Gateway (Gateway API implementation) controller values.
# Gateway API CRDs (v1.6.1, standard channel), Envoy Gateway CRDs and the
# "safe-upgrades" admission policy are applied separately from the
# gateway-crds-helm chart (scripts/deploy.sh, step gateway-controller),
# because Helm never upgrades CRDs.
crds:
  enabled: false
deployment:
  envoyGateway:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
    logging:
      level:
        default: info
