# local-path-provisioner (vendored upstream manifest, see versions.env)
# provides a default StorageClass for Prometheus, Alertmanager and VictoriaLogs PVCs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - local-path-storage.yaml
patches:
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
