# Private CA for the demo (no external ACME/DNS dependencies -> fully reproducible offline-friendly).
#   selfsigned-bootstrap  -> issues the CA certificate "mts-demo-ca"
#   mts-demo-ca (ClusterIssuer) -> signs leaf certificates (e.g. *.demo.local for the Gateway)
# The CA certificate can be exported for curl --cacert, see README.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mts-demo-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: MTS Demo Root CA
  secretName: mts-demo-ca
  duration: 87600h # 10y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mts-demo-ca
spec:
  ca:
    secretName: mts-demo-ca
