# Wildcard certificate for the HTTPS listener, signed by the private demo CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-local-wildcard
  namespace: gateway
spec:
  secretName: demo-local-tls
  commonName: "*.demo.local"
  dnsNames:
    - "demo.local"
    - "*.demo.local"
  duration: 2160h   # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: mts-demo-ca
