# Single shared edge Gateway. Platform team owns it (namespace "gateway"),
# application teams attach HTTPRoutes from namespaces labelled
# mts-demo/gateway-access=true (role-oriented Gateway API model).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              mts-demo/gateway-access: "true"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.demo.local"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: demo-local-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              mts-demo/gateway-access: "true"
