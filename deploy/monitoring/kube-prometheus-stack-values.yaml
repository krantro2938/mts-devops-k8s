# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# node-exporter, kube-state-metrics + default Kubernetes dashboards and alert rules.
fullnameOverride: kps

crds:
  enabled: true

# ---------------------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Pick up every ServiceMonitor / PodMonitor / PrometheusRule in the cluster,
    # not only the ones labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 3d
    retentionSize: 4GB
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1500Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # Exemplars / remote-write receiver are not needed for the demo.
    enableAdminAPI: false
    externalUrl: http://prometheus.demo.local:30080/

# ---------------------------------------------------------------------------
# Alertmanager (receives the alerts from deploy/monitoring/prometheus-rules.yaml)
# ---------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

# ---------------------------------------------------------------------------
# kubeadm control-plane components. kubeadm-config.yaml.tpl binds their
# metrics endpoints to 0.0.0.0, so all of these targets are UP.
# ---------------------------------------------------------------------------
kubeEtcd:
  service:
    port: 2381
    targetPort: 2381
kubeControllerManager:
  serviceMonitor:
    https: true
    insecureSkipVerify: true
kubeScheduler:
  serviceMonitor:
    https: true
    insecureSkipVerify: true
kubeProxy:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# ---------------------------------------------------------------------------
# Grafana
# ---------------------------------------------------------------------------
grafana:
  fullnameOverride: grafana
  # Admin credentials come from a Secret generated by scripts/deploy.sh
  # (random password, never stored in git). `make creds` prints them.
  admin:
    existingSecret: ops-credentials
    userKey: username
    passwordKey: password
  defaultDashboardsTimezone: browser
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 384Mi
  # Logs data source (VictoriaLogs) for the "Explore" view and the demo dashboard.
  plugins:
    - victoriametrics-logs-datasource
  additionalDataSources:
    - name: VictoriaLogs
      uid: victorialogs
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://victorialogs.logging.svc:9428
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  grafana.ini:
    server:
      root_url: http://grafana.demo.local:30080/
    analytics:
      check_for_updates: false
      reporting_enabled: false
    users:
      allow_sign_up: false
