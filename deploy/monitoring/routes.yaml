# Observability UIs published through the same Gateway (hostname-based routing).
# Prometheus and Alertmanager have no auth of their own -> HTTP Basic Auth on the
# Gateway (Envoy Gateway SecurityPolicy). The htpasswd Secret "ops-basic-auth" is
# generated by scripts/deploy.sh with a random password (never committed).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: gateway
  hostnames:
    - grafana.demo.local
  rules:
    - backendRefs:
        - name: grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: gateway
  hostnames:
    - prometheus.demo.local
  rules:
    - backendRefs:
        - name: kps-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: gateway
  hostnames:
    - alertmanager.demo.local
  rules:
    - backendRefs:
        - name: kps-alertmanager
          port: 9093
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ops-basic-auth
  namespace: monitoring
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prometheus
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alertmanager
  basicAuth:
    users:
      name: ops-basic-auth
